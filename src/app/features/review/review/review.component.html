<div class="review-page" *ngIf="data">
  <!-- Score Summary -->
  <mat-card class="score-card">
    <h2>Review Answers</h2>

    <mat-chip color="primary"> Score: {{ data.score }} </mat-chip>
  </mat-card>

  <!-- Question List -->
  <div *ngFor="let q of data.questions; let i = index">
    <mat-card class="question-card">
      <!-- Question Header -->
      <div class="question-header">
        <h3>Question {{ i + 1 }}</h3>
      </div>

      <p class="question-content">
        {{ q.content }}
      </p>

      <mat-divider></mat-divider>

      <!-- Answers -->
      <div class="answer-list">
        <div
          *ngFor="let a of q.answers"
          class="answer-item"
          [class.correct]="isCorrect(a)"
          [class.wrong]="isSelected(q, a) && !isCorrect(a)"
          [class.selected]="isSelected(q, a)"
        >
          <div class="answer-content">
            <span>
              {{ a.content }}
            </span>

            <div class="answer-status">
              <mat-icon *ngIf="isCorrect(a)"> check_circle </mat-icon>

              <mat-icon *ngIf="isSelected(q, a) && !isCorrect(a)">
                cancel
              </mat-icon>
            </div>
          </div>
        </div>
      </div>
    </mat-card>
  </div>
</div>
