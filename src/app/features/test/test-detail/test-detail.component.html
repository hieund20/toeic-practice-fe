<div class="page-container" *ngIf="test">
  <!-- HEADER -->
  <mat-card class="top-card">
    <div class="top-section">
      <div>
        <h2>{{ test.title }}</h2>
        <p>Question {{ currentIndex + 1 }} / {{ flatQuestions.length }}</p>
      </div>

      <div class="header-actions">
        <mat-chip> ⏱ {{ timeLeft }} </mat-chip>

        <button mat-raised-button color="primary" (click)="submit()">
          Submit
        </button>
      </div>
    </div>

    <mat-progress-bar
      mode="determinate"
      [value]="((currentIndex + 1) / flatQuestions.length) * 100"
    >
    </mat-progress-bar>
  </mat-card>

  <!-- MAIN CONTENT -->
  <div class="content-layout">
    <!-- LEFT PANEL -->
    <mat-card class="question-panel">
      <ng-container *ngIf="currentQuestion">
        <!-- Group Content -->
        <div *ngIf="currentGroup" class="group-section">
          <audio
            *ngIf="currentGroup.audioUrl"
            controls
            [src]="currentGroup.audioUrl"
          ></audio>

          <div *ngIf="currentGroup.content" class="passage">
            {{ currentGroup.content }}
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="question-section">
          <h3>Question {{ currentIndex + 1 }}</h3>

          <!-- Question Audio -->
          <audio
            *ngIf="currentQuestion.audioUrl"
            controls
            [src]="currentQuestion.audioUrl"
            class="question-audio"
          ></audio>

          <!-- Question Image -->
          <img
            *ngIf="currentQuestion.imageUrl"
            [src]="currentQuestion.imageUrl"
            alt="Question image"
            class="question-image"
          />

          <!-- Question Content -->
          <p>
            {{ currentQuestion.content }}
          </p>
        </div>
      </ng-container>
    </mat-card>

    <!-- RIGHT PANEL -->
    <mat-card class="answer-panel">
      <!-- Answer options -->
      <div *ngIf="currentQuestion">
        <mat-radio-group
          [value]="selectedAnswers[currentQuestion.id]"
          (change)="selectAnswer(currentQuestion.id, $event.value)"
        >
          <div *ngFor="let a of currentQuestion.answers" class="answer-item">
            <mat-radio-button [value]="a.id">
              {{ a.content }}
            </mat-radio-button>
          </div>
        </mat-radio-group>
      </div>

      <mat-divider></mat-divider>

      <!-- Navigator -->
      <div class="navigator">
        <button
          mat-stroked-button
          *ngFor="let q of flatQuestions; let i = index"
          [color]="i === currentIndex ? 'primary' : ''"
          (click)="goTo(i)"
        >
          {{ i + 1 }}
        </button>
      </div>
    </mat-card>
  </div>
</div>
