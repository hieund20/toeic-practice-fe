<div class="page-container">
  <app-breadcrumb [items]="breadcrumbs"> </app-breadcrumb>
  
  <div class="page-header">
    <h2 class="page-title">Manage Tests</h2>

    <button mat-raised-button color="primary" (click)="createTest()">
      Create Test
    </button>
  </div>

  <table mat-table [dataSource]="tests">
    <!-- Title -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>

      <td mat-cell *matCellDef="let test">
        {{ test.title }}
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let test">
        <button mat-icon-button color="accent" (click)="manageTest(test.id)">
          <mat-icon>settings</mat-icon>
        </button>
        <button mat-icon-button color="primary" (click)="editTest(test.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTest(test.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
