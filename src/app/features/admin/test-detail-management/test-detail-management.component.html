<div class="page-container" *ngIf="test">
  <div class="page-header">
    <h2>Manage: {{ test.title }}</h2>

    <button mat-raised-button color="primary" (click)="createPart()">
      Create Part
    </button>
  </div>

  <div *ngIf="test.parts.length === 0">No parts yet. Create one.</div>

  <div *ngFor="let part of test.parts">
    <mat-card class="part-card">
      <mat-card-title> Part {{ part.partNumber }} </mat-card-title>

      <mat-card-content>
        <p>Questions: {{ part.questions.length }}</p>
        <p>Groups: {{ part.groups.length }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          (click)="manageQuestions(part)"
        >
          Manage Questions
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
