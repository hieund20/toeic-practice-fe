<div class="page-container">
  <app-breadcrumb [items]="breadcrumbs"> </app-breadcrumb>

  <div class="page-header">
    <h2 class="page-title">Question Groups</h2>

    <button mat-raised-button color="primary" (click)="createGroup()">
      Create Group
    </button>
  </div>

  <div class="app-card">
    <table mat-table [dataSource]="groups" class="group-table">
      <!-- Title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>

        <td mat-cell *matCellDef="let group">
          {{ group.title }}
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let group">
          <button
            mat-icon-button
            color="accent"
            (click)="manageQuestions(group.id)"
          >
            <mat-icon> list </mat-icon>
          </button>

          <button mat-icon-button color="primary" (click)="editGroup(group.id)">
            <mat-icon> edit </mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteGroup(group.id)">
            <mat-icon> delete </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
