<mat-toolbar class="header-toolbar">
  <a routerLink="/tests" class="brand" aria-label="Go to practice tests">
    <span class="brand-mark"><mat-icon>school</mat-icon></span>
    <span class="brand-name">{{ title }}</span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <a mat-button routerLink="/tests" routerLinkActive="nav-link-active">Practice tests</a>
    <a *ngIf="authService.isAdmin()" mat-button routerLink="/admin/tests" routerLinkActive="nav-link-active">
      <mat-icon>admin_panel_settings</mat-icon>
      Admin
    </a>
  </nav>

  <span class="spacer"></span>

  <button class="user-trigger" mat-button [matMenuTriggerFor]="userMenu">
    <span class="user-avatar">{{ userName ? userName.charAt(0) : '?' }}</span>
    <span class="user-name">{{ userName || 'My account' }}</span>
    <mat-icon class="user-chevron">expand_more</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
